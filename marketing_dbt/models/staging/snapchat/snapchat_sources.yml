version: 2

sources:
  - name: snapchat
    description: "Raw Snapchat advertising data ingested into Databricks."

    database: "{{ var('source_catalog', 'marketing_development') }}"
    schema: "{{ var('source_schema', 'bronze') }}"
   
    tables:
      - name: snapchat_campaigns
        description: "Snapchat campaign information."
      

      - name: snapchat_adgroups
        description: "Snapchat ad group history."

      - name: snapchat_ads
        description: "Snapchat advertisements information."

      - name: snapchat_ads_stats
        description: "Snapchat advertising performance statistics."